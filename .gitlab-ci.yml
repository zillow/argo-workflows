image: golang:1.21

.install_docker:
  before_script:
    - |
      wget -O docker-cli.deb https://download.docker.com/linux/debian/dists/bullseye/pool/stable/amd64/docker-ce-cli_20.10.18~3-0~debian-bullseye_amd64.deb && \
      dpkg -i docker-cli.deb && \
      rm docker-cli.deb

variables:
  MAJOR_VERSION: "0"
  MINOR_VERSION: "1"
  ORGANIZATION_NAME: "artificial-intelligence"
  TEAM_NAME: "ai-platform"
  ARGO_WORKFLOWS_VERSION: "v3.5.6"

.build_templatized_docker_image:
  before_script:
    - !reference [.install_docker, before_script]
    # Inject org & team names to conform to AIP naming conventions that make it possible to set
    # permissions and retention policies at each level.
    - IMAGE_REPOSITORY_PREFIX="${DOCKER_REPO_URL}/${ORGANIZATION_NAME}/${TEAM_NAME}"
    # Ensure image tag uses branch/tag slug instead of pipeline ID
    - IMAGE_TAG="${ARGO_WORKFLOWS_VERSION}-${CI_COMMIT_REF_SLUG}" # Use branch/tag slug
    # Actually set up the naming for the image we're currently building.
    - IMAGE_REPOSITORY="${IMAGE_REPOSITORY_PREFIX}/${ARTIFACT_NAME}"
    - IMAGE_REPOSITORY_TAG="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
  script:
    # The Dockerfile already runs `make dist/...` inside the build stages it needs,
    # so we don't pre-build anything on the host. Pre-building only the
    # workflow-controller binary used to silently hide the fact that the argocli
    # (argo-server) image -- the one that actually contains the compiled UI bundle
    # -- was never being built or pushed from this pipeline.
    - echo "Building Docker image target=${DOCKER_TARGET} for ${ARTIFACT_NAME}... CONTEXT is -->${CONTEXT}<--"
    - |
      DOCKER_BUILDKIT=1 docker build \
        --target ${DOCKER_TARGET} \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --build-arg "IMAGE_REPOSITORY_TAG=${IMAGE_REPOSITORY_TAG}" \
        -t ${IMAGE_REPOSITORY_TAG} \
        ${CONTEXT}
    - echo ${DOCKER_API_KEY} | docker login -u ${DOCKER_USERNAME} --password-stdin ${DOCKER_REPO_URL}
    - docker push ${IMAGE_REPOSITORY_TAG}

stages:
  - build:images

# Workflow controller image (orchestrates workflows on k8s, no UI).
# Kept under the existing `argo-workflows` artifact name for backwards
# compatibility with current aip-k8s-manifests references.
build:workflow-controller:
  extends: .build_templatized_docker_image
  variables:
    ARTIFACT_NAME: "argo-workflows"
    DOCKER_TARGET: "workflow-controller"
    CONTEXT: "./"
  stage: build:images

# Argo CLI / argo-server image. This is the image used by the `argo-server`
# Deployment and is the ONLY image that contains the compiled UI bundle
# (see Dockerfile stages `argo-ui` -> `argocli-build` -> `argocli`).
# Any UI fix under ui/src/** only ships through this image.
build:argo-server:
  extends: .build_templatized_docker_image
  variables:
    ARTIFACT_NAME: "argo-server"
    DOCKER_TARGET: "argocli"
    CONTEXT: "./"
  stage: build:images

# Argo executor image (used as init/sidecar in workflow pods, no UI).
build:argoexec:
  extends: .build_templatized_docker_image
  variables:
    ARTIFACT_NAME: "argoexec"
    DOCKER_TARGET: "argoexec"
    CONTEXT: "./"
  stage: build:images
